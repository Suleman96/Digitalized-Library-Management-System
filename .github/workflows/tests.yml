name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt pytest pytest-cov

      - name: Create dummy env
        run: |
          echo "GOOGLE_API_KEY=dummy-key-for-tests" >> $GITHUB_ENV
          echo "ANTHROPIC_API_KEY=dummy-key-for-tests" >> $GITHUB_ENV

      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=term-missing --ignore=tests/test_app_integration.py
        env:
          GOOGLE_API_KEY: dummy-key-for-tests
          ANTHROPIC_API_KEY: dummy-key-for-tests
