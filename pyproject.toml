[project]
name = "iqra-digital-library"
version = "3.0.0"
description = "Hybrid-retrieval digital library with an advanced RAG pipeline and a LangGraph concierge agent."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["archive", "artifacts", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends() in defaults is the documented pattern
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
